[project]
name = "kedro-semantic-layer"
version = "0.1.0"
description = "Define Boring Semantic Layer models on Kedro datasets, straight from the catalog"
readme = "README.md"
authors = [
    { name = "Deepyaman Datta", email = "deepyaman.datta@utexas.edu" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "boring-semantic-layer>=0.3.15",
    "ibis-framework>=11.0.0",
    "kedro>=0.19.7",
]
keywords = ["kedro", "semantic-layer", "ibis", "boring-semantic-layer", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Kedro",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/deepyaman/kedro-semantic-layer"
Issues = "https://github.com/deepyaman/kedro-semantic-layer/issues"

[project.entry-points."kedro.hooks"]
kedro-semantic-layer = "kedro_semantic_layer.plugin:hooks"

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "examples/airlines",
]

[tool.uv.sources]
airlines = { workspace = true }

[dependency-groups]
dev = [
    "airlines",
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "ruff>=0.6.7",
]
test = [
    "ibis-framework[duckdb]>=11.0.0",
    "pytest>=8.0",
]
